name: Blender Cyberpunk Render 15s Cinematic
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Render preview frames first; full renders all 360 frames
        type: choice
        options: [preview, full]
        default: preview
  pull_request:
    paths:
      - render.py
      - make_audio.py
      - verify_outputs.py
      - tests/**
      - .github/workflows/render.yml
  push:
    branches: [main]
    paths:
      - render.py
      - make_audio.py
      - verify_outputs.py
      - tests/**
      - .github/workflows/render.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      RENDER_MODE: ${{ github.event_name == 'pull_request' && 'preview' || github.event_name == 'push' && 'full' || inputs.mode || 'preview' }}
      PREVIEW_LIST: "1,17,18,32,33,48,65,81,115,147,193,212,227,244,259,302,341,360"
    steps:
      - uses: actions/checkout@v4
      - name: Check Python and offline regression tests
        run: |
          python3 -m py_compile render.py make_audio.py verify_outputs.py tests/test_preflight.py
          python3 -m unittest discover -s tests -v
      - name: Generate and validate audio
        run: |
          python3 make_audio.py
          python3 verify_outputs.py audio
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg xvfb xauth libgl1-mesa-dri python3-numpy
          blender --version
          ffmpeg -version
      - name: Render preview frames
        if: env.RENDER_MODE == 'preview'
        run: |
          PREVIEW_FRAMES="$PREVIEW_LIST" xvfb-run -a -s "-screen 0 1280x720x24" blender -b -t 3 --python-exit-code 1 -P render.py
          python3 verify_outputs.py preview --preview-frames "$PREVIEW_LIST"
      - name: Render 2-second motion preview of the duel
        if: env.RENDER_MODE == 'preview'
        run: |
          MOTION_PREVIEW_START=147 MOTION_PREVIEW_COUNT=48 xvfb-run -a -s "-screen 0 1280x720x24" blender -b -t 3 --python-exit-code 1 -P render.py
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 147 -i motion/frame_%04d.png -ss 6.083333 -i action.wav -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 160k -t 2 Cyberpunk_Fight_Motion_Preview_2s.mp4
          python3 verify_outputs.py motion
      - name: Render 360 frames with CC0 textures
        if: env.RENDER_MODE == 'full'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" blender -b -t 3 --python-exit-code 1 -P render.py
          python3 verify_outputs.py frames
      - name: Assemble and validate video
        if: env.RENDER_MODE == 'full'
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 1 -i frames/frame_%04d.png -i action.wav -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart -t 15 Cyberpunk_Cloud_3D_Cinematic_15s.mp4
          test -s Cyberpunk_Cloud_3D_Cinematic_15s.mp4
          python3 verify_outputs.py video
      - name: Check saved scene
        run: test -s CYBERPUNK_CLOUD_EXPERIMENT_V5_15s.blend
      - name: Save preview and scene
        if: env.RENDER_MODE == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk_preview
          path: |
            preview/*.png
            Cyberpunk_Fight_Motion_Preview_2s.mp4
            action.wav
            CYBERPUNK_CLOUD_EXPERIMENT_V5_15s.blend
          if-no-files-found: error
          retention-days: 5
      - name: Save video and scene
        if: env.RENDER_MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk_Cloud_3D_Cinematic_15s
          path: |
            Cyberpunk_Cloud_3D_Cinematic_15s.mp4
            action.wav
            CYBERPUNK_CLOUD_EXPERIMENT_V5_15s.blend
          if-no-files-found: error
          retention-days: 5
