      - name: Render 72 frames in Blender with two real armature-rigged GLB actors
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" blender -b -t 3 -P render.py
          test "$(find frames -name 'frame_*.png' | wc -l)" -eq 72

      - name: Mix authentic CC0 firearm recordings with precise shot timing
        run: python3 make_audio.py

      - name: Assemble the final 3-second MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i frames/frame_%04d.png \
            -i action.wav -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -t 3.0 Cyberpunk_Cloud_3D_Test.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Cyberpunk_Cloud_3D_Test.mp4

      - name: Publish video and original Blender file
        uses: actions/upload-artifact@v4
        with:
          name: Cyberpunk_Cloud_3D_Test
          path: |
            Cyberpunk_Cloud_3D_Test.mp4
            CYBERPUNK_CLOUD_EXPERIMENT.blend
          if-no-files-found: error
          retention-days: 5
          
