# Everything needed is embedded here. Create exactly one file:
# .github/workflows/render.yml
name: Free 3D cyberpunk Blender test (real CC0 gunshots)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: Install real Blender renderer and FFmpeg (CPU; free standard runner)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg xvfb libgl1-mesa-dri libgl1
          blender -b --python-expr "import bpy; print('BLENDER', bpy.app.version_string)"

